# 模具注塑报价系统 - nginx 引导配置（HTTP-only）
#
# 用途：全新服务器上首次部署时使用。
# 此时 Let's Encrypt 证书尚不存在，若直接上 deploy/nginx.conf（含 443 块）
# 会因证书文件缺失导致 `nginx -t` 失败、整个部署中断。
#
# 流程（见 post-install.sh）：
#   1) 先用本文件启动 HTTP 服务 + 暴露 ACME 校验路径
#   2) certbot certonly --webroot 签发证书
#   3) 签发成功后换成 deploy/nginx.conf（HTTP→HTTPS 跳转 + 443 主站）

upstream mqs_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name ycwl.chat 47.242.248.104 _;

    # Let's Encrypt HTTP-01 校验路径
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/mqs-access.log;
    error_log  /var/log/nginx/mqs-error.log;

    client_max_body_size 10M;

    location /api/ {
        proxy_pass http://mqs_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # /share/<token> 交给前端 SPA 处理（客户查看报价单页面）
    location /health {
        proxy_pass http://mqs_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    root /opt/mold-quote-system/apps/web/dist;
    index index.html;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(env|git|svn) { deny all; return 404; }
}
