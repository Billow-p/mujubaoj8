# gzip 压缩（放在 /etc/nginx/conf.d/gzip.conf，由 http 上下文 include）
#
# 前端 JS 未压缩约 367KB，开启后约 100KB，移动网络首屏明显更快。
# 注意：不要对图片/字体/已压缩格式启用，纯属浪费 CPU。

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_disable "msie6";

gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    application/manifest+json
    image/svg+xml;
