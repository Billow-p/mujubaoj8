# 模具注塑报价系统 - nginx 配置
# 静态前端 + API 反代

upstream mqs_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name wycl.chat www.wycl.chat 47.242.248.104 _;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 日志
    access_log /var/log/nginx/mqs-access.log;
    error_log  /var/log/nginx/mqs-error.log;

    # 客户端最大请求体（PDF/Excel 上传）
    client_max_body_size 10M;

    # API 反代
    location /api/ {
        proxy_pass http://mqs_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 分享链接 API（无 /api 前缀）
    location /share/ {
        proxy_pass http://mqs_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 健康检查
    location /health {
        proxy_pass http://mqs_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 静态文件（前端构建产物）
    root /opt/mold-quote-system/apps/web/dist;
    index index.html;

    # 静态资源缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 隐藏敏感文件
    location ~ /\.(env|git|svn) { deny all; return 404; }
}
