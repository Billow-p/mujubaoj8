# 模具注塑报价系统 - nginx 配置
# 静态前端 + API 反代
#
# 结构：
#   [1] IP / 未知域名直连 —— 保持 HTTP 可用（部署初期、内网排查用）
#   [2] 域名 ycwl.chat:80 —— ACME 校验 + 301 跳转到 HTTPS
#   [3] 域名 ycwl.chat:443 —— HTTPS 主站
#
# 证书由 certbot（webroot 模式）签发，路径 /etc/letsencrypt/live/ycwl.chat/
# 续期：systemctl list-timers | grep certbot   （或 certbot renew --dry-run 验证）

upstream mqs_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ============================================================
# [1] IP / 未知域名直连（HTTP，不加跳转）
# ============================================================
server {
    listen 80;
    listen [::]:80;
    server_name 47.242.248.104 _;

    # Let's Encrypt HTTP-01 校验路径
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
    }

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/mqs-access.log;
    error_log  /var/log/nginx/mqs-error.log;

    client_max_body_size 10M;

    # API 反代
    location /api/ {
        proxy_pass http://mqs_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 注意：/share/<token> 是前端页面（客户查看报价单），走下方 SPA fallback。
    # 后端接口在 /api/share/<token>，由上面的 /api/ 反代覆盖。
    location /health {
        proxy_pass http://mqs_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    root /opt/mold-quote-system/apps/web/dist;
    index index.html;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(env|git|svn) { deny all; return 404; }
}

# ============================================================
# [2] ycwl.chat : HTTP —— 只做 ACME 校验，其余跳 HTTPS
# ============================================================
server {
    listen 80;
    listen [::]:80;
    server_name ycwl.chat www.ycwl.chat;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================
# [3] ycwl.chat : HTTPS 主站
# ============================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ycwl.chat www.ycwl.chat;

    ssl_certificate         /etc/letsencrypt/live/ycwl.chat/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/ycwl.chat/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/ycwl.chat/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:MQS_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS（首次上线，先不加 includeSubDomains / preload，便于回退）
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/mqs-access.log;
    error_log  /var/log/nginx/mqs-error.log;

    client_max_body_size 10M;

    # 续期校验（走 80 亦可，这里冗余保留）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
    }

    location /api/ {
        proxy_pass http://mqs_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # /share/<token> 交给前端 SPA 处理（客户查看报价单页面）
    location /health {
        proxy_pass http://mqs_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    root /opt/mold-quote-system/apps/web/dist;
    index index.html;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(env|git|svn) { deny all; return 404; }
}
