/* 由「计算方式」生成表达式 —— 用户永远不用看到这一步 */
function buildExpr(it){
  const c=it.calc||{t:'fixed',v:{}},v=c.v||{};
  switch(c.t){
    case 'fixed':  return String(Number(v.amount)||0);
    case 'qty':    return (P().some(p=>p.n===v.src)?v.src:(Number(v.srcQty)||1))+' 乘以 '+(Number(v.price)||0);
    case 'size':{
      const dims=[v.l,v.w,v.h].filter(Boolean);
      if(!dims.length)return '0';
      return dims.join(' 乘以 ')+' 除以 1000 乘以 '+(Number(v.density)||1)+' 除以 1000 乘以 '+
             (P().some(p=>p.n===v.priceVar)?v.priceVar:(Number(v.priceFixed)||0));
    }
    case 'hours':  return (Number(v.hours)||0)+' 乘以 '+(Number(v.rate)||0);
    case 'weight': return (P().some(p=>p.n===v.wVar)?v.wVar:'0')+' 乘以 '+
             (P().some(p=>p.n===v.priceVar)?v.priceVar:(Number(v.priceFixed)||0))+
             ' 乘以 ( 1 加上 '+(Number(v.loss)||0)+' )';
    case 'percent':return '0';
    case 'manual': return '0';
    case 'formula':return it.f||'0';
  }
  return '0';
}
/* 计算方式的中文读法 */
function readable(it){
  const c=it.calc||{t:'fixed',v:{}},v=c.v||{};
  switch(c.t){
    case 'fixed':  return '固定金额 '+money(Number(v.amount)||0);
    case 'qty':    return (v.src||'数量')+' × '+(Number(v.price)||0)+' 元';
    case 'size':   return [v.l,v.w,v.h].filter(Boolean).join(' × ')+' → 体积换重量 × '+(v.priceVar||'单价');
    case 'hours':  return (Number(v.hours)||0)+' 小时 × '+(Number(v.rate)||0)+' 元/小时';
    case 'weight': return (v.wVar||'重量')+' × '+(v.priceVar||'单价')+' × (1 + 损耗 '+(Number(v.loss)||0)+')';
    case 'percent':return (v.base||'模具小计')+' × '+(Math.round((Number(v.rate)||0)*1000)/10)+'%';
    case 'manual': return '报价时手动填写金额';
    case 'formula':return it.f||'（未填写）';
  }
  return '';
}

/* 受限求值器 */
const OPS=['+','-','*','/','%','>=','<=','==','!=','>','<','&&','||','(',')',','];
const FNS=['如果','那么','否则','最大值','最小值','取整'];
const CN_OP={'加上':'+','减去':'-','乘以':'*','除以':'/','取余':'%','大于等于':'>=','小于等于':'<=','等于':'==','不等于':'!=','大于':'>','小于':'<','且':'&&','或':'||','（':'(','）':')','，':','};
const FN_EXPR={'如果':'if(','那么':',','否则':',','最大值':'max(','最小值':'min(','取整':'round('};
function tokenize(s){
  let t=s||'';
  t=t.replace(/[×✕]/g,' 乘以 ').replace(/[÷]/g,' 除以 ').replace(/[＋]/g,' 加上 ').replace(/[－—–]/g,' 减去 ');
  t=t.replace(/[（）]/g,m=>m==='（'?' ( ':' ) ').replace(/[，,]/g,' , ');
  t=t.replace(/(>=|<=|==|!=)/g,' $1 ').replace(/([()+\-*/%<>,])/g,' $1 ');
  Object.keys(CN_OP).forEach(k=>{t=t.split(k).join(' '+CN_OP[k]+' ');});
  return t.split(/\s+/).filter(Boolean);
}
function parse(s){
  return tokenize(s).map(t=>{
    if(/^-?\d+(\.\d+)?$/.test(t))return{t:'n',v:Number(t)};
    if(P().some(p=>p.n===t))return{t:'p',n:t};
    if(OPS.includes(t))return{t:'o',o:t};
    if(FNS.includes(t))return{t:'f',o:t};
    return{t:'u',o:t};
  });
}
function exprOf(bs){return bs.map(b=>b.t==='n'?String(b.v):b.t==='p'?'v'+P().findIndex(p=>p.n===b.n):b.t==='o'?b.o:b.t==='f'?FN_EXPR[b.o]:' ').join(' ');}
function subOf(bs){return bs.map(b=>b.t==='n'?b.v:b.t==='p'?num((P().find(x=>x.n===b.n)||{}).v||0):b.t==='o'?b.o:b.t==='f'?b.o:'?').join(' ');}
function ev(src,sc){
  let i=0;const N=src.length;
  const ws=()=>{while(i<N&&/\s/.test(src[i]))i++;};
  function lit(){ws();let j=i;while(i<N&&/[0-9.]/.test(src[i]))i++;return parseFloat(src.slice(j,i));}
  function prim(){ws();
    if(i>=N)throw new Error('INCOMPLETE');
    if(src[i]==='('){i++;const v=ex();ws();if(src[i]===')')i++;return v;}
    if(/[0-9.]/.test(src[i]))return lit();
    let j=i;while(i<N&&/[a-zA-Z0-9_]/.test(src[i]))i++;const nm=src.slice(j,i);ws();
    if(src[i]==='('){i++;const a=[];ws();
      if(src[i]!==')'){a.push(ex());while(src[i]===','){i++;a.push(ex());}}
      ws();if(src[i]===')')i++;
      if(nm==='if')return a[0]?a[1]:(a[2]||0);
      if(nm==='max')return Math.max(...a);
      if(nm==='min')return Math.min(...a);
      if(nm==='round'){const m=a[1]!==undefined?Math.pow(10,a[1]):1;return Math.round(a[0]*m)/m;}
      throw new Error('未知函数 '+nm);}
    if(!(nm in sc))throw new Error('NOTFOUND');
    return sc[nm];}
  function un(){ws();if(src[i]==='-'){i++;return -un();}if(src[i]==='!'){i++;return un()?0:1;}return prim();}
  function mul(){let l=un();for(;;){ws();const c=src[i];
    if(c==='*'){i++;l*=un();}else if(c==='/'){i++;const r=un();if(r===0)throw new Error('DIV0');l/=r;}
    else if(c==='%'){i++;l%=un();}else return l;}}
  function add(){let l=mul();for(;;){ws();const c=src[i];
    if(c==='+'){i++;l+=mul();}else if(c==='-'){i++;l-=mul();}else return l;}}
  function cmp(){let l=add();for(;;){ws();
    if(src.startsWith('>=',i)){i+=2;l=l>=add()?1:0;}else if(src.startsWith('<=',i)){i+=2;l=l<=add()?1:0;}
    else if(src.startsWith('==',i)){i+=2;l=l===add()?1:0;}else if(src.startsWith('!=',i)){i+=2;l=l!==add()?1:0;}
    else if(src[i]==='>'){i++;l=l>add()?1:0;}else if(src[i]==='<'){i++;l=l<add()?1:0;}else return l;}}
  function land(){let l=cmp();for(;;){ws();if(src.startsWith('&&',i)){i+=2;const r=cmp();l=l&&r?1:0;}else return l;}}
  function lor(){let l=land();for(;;){ws();if(src.startsWith('||',i)){i+=2;const r=land();l=l||r?1:0;}else return l;}}
  function ex(){return lor();}
  const v=ex();ws();if(i<src.length)throw new Error('INCOMPLETE');
  return v;
}
function friendly(m){
  if(m==='DIV0')return '算到「除以 0」了，检查一下填的数字';
  if(m==='INCOMPLETE')return '缺少运算符号，请检查计算方式里的填空';
  if(m==='NOTFOUND')return '用到的数据项不存在了，可能左边被删掉了，请重新选';
  return m;
}
function sc(){const s={};P().forEach((p,i)=>{s['v'+i]=Number(p.v)||0;});return s;}

/* 汇总计算 */
function calcAll(){
  const running={mold:0,inj:0,mat:0,list:[]};
  I().forEach(it=>{
    if(!it.on){running.list.push({it,v:0,off:true});return;}
    const c=it.calc||{t:'fixed',v:{}};
    if(c.t==='percent'){
      const base=c.v.base==='材料费合计'?running.mat:running.mold;
      const v=Math.round(base*(Number(c.v.rate)||0));
      if(it.s==='注塑')running.inj+=v;else running.mold+=v;
      running.list.push({it,v,base});
      return;
    }
    if(c.t==='manual'){running.list.push({it,v:0,manual:true});return;}
    try{
      const bs=parse(buildExpr(it));
      const bad=bs.find(b=>b.t==='u');
      if(bad)throw new Error('NOTFOUND');
      const v=ev(exprOf(bs),sc());
      if(it.s==='注塑')running.inj+=v;else running.mold+=v;
      if(it.c==='材料费')running.mat+=v;
      running.list.push({it,v});
    }catch(e){running.list.push({it,v:0,err:friendly(e.message)});}
  });
  return running;
}

      '<option'+(it.s==='模具'?' selected':'')+'>模具</option><option'+(it.s==='注塑'?' selected':'')+'>注塑</option></select></div>'+
    prev+
    '<div class="acts"><span class="adv" onclick="toggleAdv('+i+')">'+(advOpen[i]?'收起高级选项':'高级选项')+'</span>'+
      '<span style="flex:1"></span>'+
      '<button class="btn gh sm" style="color:#b91c1c" onclick="delItem('+i+')">删除这一项</button></div>'+
    (advOpen[i]?'<div class="hint" style="margin-top:8px">分类标签：<input value="'+esc(it.c)+'" onchange="edit('+i+',\'c\',this.value)" style="width:120px;margin-left:6px">'+
      '　说明（给客户看的）：<input value="'+esc(it.d||'')+'" onchange="edit('+i+',\'d\',this.value)" style="width:180px;margin-left:6px"></div>':'')+
    '</div>';
}

function renderItems(){
  const run=calcAll();
  document.getElementById('icount').textContent=I().length+' 项';
  document.getElementById('ilist').innerHTML=I().map((it,i)=>{
    const r=run.list.find(x=>x.it===it)||{};
    let val=r.err?'出错了':r.manual?'报价时填':(it.on?money(r.v||0):'—');
    let cls='rowitem'+(openItem===i?' on':'')+(it.on?'':' off');
    return '<div class="'+cls+'" onclick="openCfg('+i+')">'+
      '<input class="cbx" type="checkbox" '+(it.on?'checked':'')+' onclick="event.stopPropagation();toggleOn('+i+')">'+
      '<span class="rname">'+esc(it.n)+'</span>'+
      '<span class="rmode">'+esc(CALC_NAME[(it.calc||{}).t]||'—')+'</span>'+
      '<span class="rval">'+val+'</span></div>'+
      (openItem===i?cfgHtml(i):'');
  }).join('')||'<div class="empty">还没有费用项，点右上角「加一项费用」</div>';
}
function openCfg(i){openItem=openItem===i?null:i;renderItems();}
function toggleAdv(i){advOpen[i]=!advOpen[i];renderItems();}
function toggleOn(i){
  I()[i].on=!I()[i].on;renderItems();markDirty();
}
/* 按名字智能猜参数，切计算方式时尽量不用用户再选 */
function guess(kw){
  const hit=P().filter(p=>p.n.indexOf(kw)>=0);
  return hit.length?hit[0].n:'';
}
function setCalcType(i,t){
  const it=I()[i];
  it.calc={t:t,v:{}};
  if(t==='fixed')it.calc.v={amount:0};
  if(t==='qty')it.calc.v={src:guess('腔')||guess('数量')||guess('件'),price:0};
  if(t==='size')it.calc.v={l:guess('长'),w:guess('宽'),h:guess('高'),density:7.85,priceVar:guess('单价')};
  if(t==='hours')it.calc.v={hours:0,rate:0};
  if(t==='weight')it.calc.v={wVar:guess('重量')||guess('单件'),priceVar:guess('单价'),loss:0.05};
  if(t==='percent')it.calc.v={base:'模具小计',rate:0.15};
  if(t==='formula')it.f=it.f||'';
  renderItems();markDirty();
}
function cfgNum(i,f,v){I()[i].calc.v[f]=Number(v)||0;renderItems();markDirty();}
function cfgSel(i,f,v){I()[i].calc.v[f]=v;renderItems();markDirty();}
function cfgExpr(i,v){I()[i].f=v;renderItems();markDirty();}
function edit(i,f,v){I()[i][f]=v;renderItems();markDirty();}
function addItem(){
  I().push({n:'新费用',c:'自定义',s:'模具',on:true,calc:{t:'fixed',v:{amount:0}}});
  openItem=I().length-1;renderAll();markDirty();
}
function delItem(i){
  if(!confirm('删除「'+I()[i].n+'」？'))return;
  I().splice(i,1);openItem=null;renderAll();markDirty();
}

function renderCalc(){
  const run=calcAll();
  document.getElementById('calc').innerHTML=run.list.map(x=>{
    const it=x.it;
    if(x.off)return '<div class="calc-item"><div class="ci-top"><span class="ci-name" style="color:#9ca3af">'+esc(it.n)+'（已停用）</span><span class="ci-val" style="color:#9ca3af">—</span></div></div>';
    if(x.manual)return '<div class="calc-item"><div class="ci-top"><span class="ci-name">'+esc(it.n)+'</span><span class="ci-val">报价时填</span></div><div class="ci-sub">'+esc(readable(it))+'</div></div>';
    if(x.err)return '<div class="calc-item"><div class="ci-top"><span class="ci-name">'+esc(it.n)+'</span><span class="ci-val">—</span></div><div class="ci-err">✗ '+esc(x.err)+'</div></div>';
    return '<div class="calc-item"><div class="ci-top"><span class="ci-name">'+esc(it.n)+'</span><span class="ci-val">'+money(x.v)+'</span></div>'+
      '<div class="ci-sub">'+esc(readable(it))+'</div></div>';
  }).join('')||'<div class="empty">加费用项后这里显示每一项怎么算出来的</div>';

  const mold=run.mold,inj=run.inj;
  const mr=rate('管理费率',0.15),pr=rate('利润率',0.10),tr=rate('税率',0.13);
  const profit=Math.round((mold+inj)*pr);
  const beforeTax=mold+inj+profit;
  const tax=Math.round(beforeTax*tr);
  const tot=beforeTax+tax;
  const pc=v=>Math.round(v*1000)/10;
  document.getElementById('total').innerHTML=
    '<div class="tr"><span>模具费用</span><span>'+money(mold)+'</span></div>'+
    '<div class="tr"><span>注塑费用</span><span>'+money(inj)+'</span></div>'+
    '<div class="tr"><span>利润 '+pc(pr)+'%</span><span>'+money(profit)+'</span></div>'+
    '<div class="tr"><span>税额 '+pc(tr)+'%</span><span>'+money(tax)+'</span></div>'+
    '<div class="tr big"><span>含税总价</span><b>'+money(tot)+'</b></div>';
  document.getElementById('mt').textContent=money(tot);
}
let folded=false;
function toggleCalc(){
  folded=!folded;const b=document.getElementById('board');
  b.classList.toggle('folded',folded);
  b.style.gridTemplateColumns=folded?'250px minmax(0,1fr) 46px':'250px minmax(0,1fr) 340px';
  document.getElementById('calcHd').style.display=folded?'none':'flex';
  document.getElementById('foldBtn').textContent=folded?'展开算价栏':'折叠算价栏';
}
function renderAll(){renderTabs();renderPane();renderItems();renderCalc();}
renderBar();renderAll();
</script>
</body>
</html>
